# Copy of shanti-ops/workers/demo-reset-cron for the LS Inventory demo. Deploy: npx wrangler deploy (from this folder).
name = "ls-inventory-demo-reset"
main = "src/index.js"
compatibility_date = "2026-10-05"
account_id = "5d8cf246f656006b81d99d734e8c0f40"

# 21:45 UTC = 03:15 IST, a quarter hour after the SB Ops demo reset.
[triggers]
crons = ["45 21 * * *"]

# Not secret. TURSO_API_TOKEN (Turso platform token) and TRIGGER_KEY are Worker secrets.
[vars]
TURSO_ORG = "pujan"
GROUP = "lsdemo"
DEMO_DB = "ls-demo"
GOLDEN_DB = "ls-demo-golden"
