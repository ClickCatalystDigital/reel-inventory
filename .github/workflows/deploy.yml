# One push to main deploys both servers, one after another, stopping at the first failure (same as
# shanti-ops' SB Ops pipeline):
#   1. checks  - the API loads, the frontend type-checks, the scripts parse
#   2. demo    - update the demo databases' schema (scripts/demo/migrate.mjs), deploy the demo Worker
#                (electronics-erp.ahromlabs.com), check it serves this commit
#   3. client  - deploy lstechnologies.in, check it serves this commit
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN         "Edit Cloudflare Workers" on the Ahrom Labs account (the demo)
#   CLIENT_CLOUDFLARE_API_TOKEN  "Edit Cloudflare Workers" on LS Technologies' account (lstechnologies.in)
#   DEMO_DB_TOKEN                Turso group token for the lsdemo group (golden + live demo databases)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: "package-lock.json\nfrontend/package-lock.json" }
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: API loads
        run: node -e "require('./app.js')"
      - name: Frontend type-checks
        run: npx --prefix frontend tsc --noEmit -p frontend
      - name: Scripts parse
        run: for f in worker.mjs scripts/demo/*.mjs scripts/wait-for-commit.mjs; do node --check "$f"; done

  demo:
    needs: checks
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: "package-lock.json\nfrontend/package-lock.json" }
      - run: npm ci
      - name: Update the demo databases' schema, build and deploy the demo Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_GROUP_TOKEN: ${{ secrets.DEMO_DB_TOKEN }}
        # One retry: the build downloads fonts and npm packages, which occasionally fail.
        run: npm run deploy:demo -- --var BUILD_COMMIT:$GITHUB_SHA || (echo "retrying once" && sleep 20 && npm run deploy:demo -- --var BUILD_COMMIT:$GITHUB_SHA)
      - name: Check the demo serves this commit
        run: node scripts/wait-for-commit.mjs https://electronics-erp.ahromlabs.com "$GITHUB_SHA" /demo

  client:
    needs: demo
    runs-on: ubuntu-latest
    environment: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: "package-lock.json\nfrontend/package-lock.json" }
      - run: npm ci
      - name: Build and deploy lstechnologies.in (frontend built without the demo flag)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLIENT_CLOUDFLARE_API_TOKEN }}
        run: npm run deploy -- --var BUILD_COMMIT:$GITHUB_SHA || (echo "retrying once" && sleep 20 && npm run deploy -- --var BUILD_COMMIT:$GITHUB_SHA)
      - name: Check the client site serves this commit
        run: node scripts/wait-for-commit.mjs https://lstechnologies.in "$GITHUB_SHA" /login
